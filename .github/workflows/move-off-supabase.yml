# The one-off move from Supabase to Cloudflare. By hand, once, from `main`.
#
#   1. reads the old database (SUPABASE_DB_URL) inside a READ ONLY transaction
#      and writes the learners' records — accounts, answers, the spacing
#      ladder, levels, notes, entitlements, reports, vetoes, the tester list,
#      the bank's difficulty counts, which clips and pictures exist — as one
#      SQL file (client/scripts/move-off-supabase.mts);
#   2. applies that file to D1 with `wrangler d1 execute --remote --file`,
#      which D1 runs all or nothing: a failure leaves the database as it was;
#   3. copies every clip and picture from the Supabase Storage buckets into
#      R2, never over an object R2 already has.
#
# Nothing is written to Supabase; it is read and left exactly as it was, so
# it is still there to go back to until it is deleted by hand. Safe to run
# again: every row is an upsert or skips what is there, and the copy skips what
# R2 has.
#
# Run it after the deploy workflow has applied the D1 migrations and the
# committed bank (an answer is about a question, so the questions go first),
# and before anybody practises on the new app.
#
# Needs, as repository secrets: SUPABASE_DB_URL, SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY (the old side, read only here), and
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID and
# R2_SECRET_ACCESS_KEY (the new side). After it has run and the app has been
# checked, delete this file, client/scripts/move-off-supabase.*, the
# `postgres` and `aws4fetch` dev dependencies, the three Supabase secrets and
# the Supabase project.
name: move off supabase

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "move" to copy the records into D1 and the media into R2'
        required: true
        default: ""

concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  move:
    name: records into D1, media into R2
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'move'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      DB: business-japanese-drill
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci

      - name: every secret this needs
        env:
          HAVE: >-
            ${{ secrets.SUPABASE_DB_URL != '' && secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != ''
            && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
            && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ "$HAVE" != "true" ]; then
            echo "::error::Needs SUPABASE_DB_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY."
            exit 1
          fi

      # The questions are the deploy's to put there; without them every answer
      # would be about a question D1 does not have.
      - name: the bank is already in D1
        run: |
          npx wrangler d1 execute "$DB" --remote --json --command "select id from items" \
            | jq '.[0].results' > "$RUNNER_TEMP/known-items.json"
          n=$(jq length "$RUNNER_TEMP/known-items.json")
          echo "$n question(s) in D1"
          if [ "$n" -eq 0 ]; then
            echo "::error::D1 has no questions yet: run the deploy database workflow first."
            exit 1
          fi

      - name: read the records (read only) and write the SQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node --experimental-strip-types scripts/move-off-supabase.mts \
            sql "$RUNNER_TEMP/move.sql" "$RUNNER_TEMP/known-items.json" | tee "$RUNNER_TEMP/move.json"
          {
            echo '## Records read from Supabase'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/move.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: apply them to D1, all or nothing
        run: npx wrangler d1 execute "$DB" --remote --yes --file "$RUNNER_TEMP/move.sql"

      - name: copy the clips and pictures into R2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node --experimental-strip-types scripts/move-off-supabase.mts media

      - name: what D1 holds now
        if: always()
        run: |
          {
            echo '## D1 after the move'
            echo
            echo '```'
            npx wrangler d1 execute "$DB" --remote --json --command "
              select (select count(*) from users)                                    as accounts,
                     (select count(*) from testers)                                  as testers,
                     (select count(*) from attempts)                                 as answers,
                     (select count(*) from review_schedule)                          as lessons,
                     (select count(*) from items where is_published = 1)            as published_items,
                     (select count(*) from audio_clips where audio_path is not null) as clips_live,
                     (select count(*) from scenes where image_path is not null)     as scenes_with_art;" \
              | jq -c '.[0].results[0]'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
