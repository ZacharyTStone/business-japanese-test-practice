# The four checks CLAUDE.md asks for before every push, run on the server too.
#
# Work lands directly on `main` with no gate in front of it, so this workflow is
# the only thing between a mistake and the tree everyone reads. That is why it
# runs on every push to `main` as well as on pull requests: a check that only
# guards PRs guards nothing in a repo where nobody opens one. It is also what
# the **deploy database** workflow waits for: a green run on a push to `main`
# is what ships.
#
# A push to any other branch is not checked on its own. A branch that is going
# anywhere gets a pull request, and the pull request is checked; checking the
# push as well ran every job twice for the same commit.
#
# Every job here is offline. No API key, no Supabase project, no network calls.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the repository, nothing else. No job here writes anything anywhere.
permissions:
  contents: read

# One run at a time per branch or pull request, and a newer push cancels the
# run it supersedes: its verdict is about a commit nobody will deploy. On `main`
# that also keeps runs finishing in push order, so the deploys they trigger do
# too. Keyed on the event as well, so a run started by hand never cancels a
# push's run and the deploy that would have followed it.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pytest — the item pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Bugs, not style: undefined names, redefinitions, unused variables,
      # comparisons that do not mean what they say. The rule set, and why it
      # stops there, is [tool.ruff] in pyproject.toml. It runs even when a
      # test failed, so one push reports both.
      - name: ruff check
        if: ${{ !cancelled() }}
        run: ruff check .
      # Types, for the pipeline. Runs whatever the steps above said, for the
      # same reason.
      - name: mypy
        if: ${{ !cancelled() }}
        run: mypy bjt

  bundles:
    name: checkbatch — every committed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Swept rather than named: a bundle added tomorrow is covered the moment
      # it lands, which is the same rule tests/test_batch_checks.py follows.
      - name: check every bundle
        run: |
          shopt -s nullglob
          found=0
          for f in batches/*.json; do
            case "$f" in *.source.json) continue ;; esac
            found=1
            echo "::group::$f"
            python -m bjt checkbatch "$f"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "no bundles found in batches/"; exit 1; }

  schema:
    name: supabase — schema, RLS, publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      # run.sh ends by running every query the Worker serves against this
      # database (client/worker/queries.db.test.ts), from client/.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      # PGHOST is set, so run.sh uses this server instead of starting its own.
      - run: supabase/test/run.sh

  app:
    name: typecheck, lint and unit tests — the Expo app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The linter client/package.json names. Runs whatever the typecheck
      # said, so one push reports both.
      - name: npm run lint
        if: ${{ !cancelled() }}
        run: npm run lint
      # The pure parts of the app — the practice reducer, the reading clock,
      # the exam date, the levels, the role table — in Node, no device.
      - name: npm test
        if: ${{ !cancelled() }}
        run: npm test
