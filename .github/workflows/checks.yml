# The checks CLAUDE.md asks for before every push, run on the server too.
#
# Work lands directly on `main` with no gate in front of it, so this workflow is
# the only thing between a mistake and the tree everyone reads. That is why it
# runs on every push to `main` as well as on pull requests: a check that only
# guards PRs guards nothing in a repo where nobody opens one. It is also what
# the **deploy database** workflow waits for: a green run on a push to `main`
# is what ships.
#
# A push to any other branch is not checked on its own. A branch that is going
# anywhere gets a pull request, and the pull request is checked; checking the
# push as well ran every job twice for the same commit.
#
# The **nightly** workflow also calls this one, on the branch it just pushed
# (`ref`), before it merges its own pull request: a pull request the workflow
# opens with its own token starts no workflow of its own, so the night asks
# for the checks itself, and merges only on green.
#
# Every job here is offline. No API key, no Cloudflare account, no network calls.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "The branch to check (the nightly job's); empty for the event's own commit"
        type: string
        required: false
        default: ""

# Read the repository, nothing else. No job here writes anything anywhere.
permissions:
  contents: read

# One run at a time per branch or pull request, and a newer push cancels the
# run it supersedes: its verdict is about a commit nobody will deploy. On `main`
# that also keeps runs finishing in push order, so the deploys they trigger do
# too. Keyed on the event as well, so a run started by hand never cancels a
# push's run and the deploy that would have followed it, and on the branch the
# nightly job asked about, so its check is never cancelled by another.
concurrency:
  group: checks-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: vitest — the item pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      # Types, for the pipeline. Runs even when a test failed, so one push
      # reports both.
      - name: npm run typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      # Bugs, not style: a promise nobody awaits, an await on something that
      # is not one, a value never read. The rule set, and why it stops there,
      # is eslint.config.mjs. Runs whatever the steps above said, for the same
      # reason.
      - name: npm run lint
        if: ${{ !cancelled() }}
        run: npm run lint

  bundles:
    name: checkbatch — every committed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Swept rather than named: a bundle added tomorrow is covered the moment
      # it lands, which is the same rule tests/batch_checks.test.ts follows.
      - name: check every bundle
        run: |
          shopt -s nullglob
          found=0
          for f in batches/*.json; do
            case "$f" in *.source.json) continue ;; esac
            found=1
            echo "::group::$f"
            node bjt/main.ts checkbatch "$f"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "no bundles found in batches/"; exit 1; }

  schema:
    name: d1 — schema, every query, the bank
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # A local D1 (Miniflare, the same SQLite the real one runs), built the
      # way the deploy builds the real one: every migration in d1/migrations,
      # then every batches/*.sql, twice. Then every query the Worker serves,
      # as a tester, and the schema's promises (client/worker/test/). Offline:
      # wrangler's local mode reaches no Cloudflare account.
      - run: npm run test:db
        env:
          WRANGLER_SEND_METRICS: "false"

  app:
    name: typecheck, lint and unit tests — the Expo app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The linter client/package.json names. Runs whatever the typecheck
      # said, so one push reports both.
      - name: npm run lint
        if: ${{ !cancelled() }}
        run: npm run lint
      # The pure parts of the app — the practice reducer, the reading clock,
      # the exam date, the levels, the role table — in Node, no device.
      - name: npm test
        if: ${{ !cancelled() }}
        run: npm test
