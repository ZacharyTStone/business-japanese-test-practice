# The nightly job: measure the bank, then grow it where it is thinnest.
#
# It has two halves, and the first one needs nothing at all.
#
#   survey    — count the library shelf by shelf (ten problem types × three
#               levels) and print the work order `bjt nightly` would execute.
#               Offline, no key, runs on every run whatever else is configured.
#               (Nightly again since 2026-09-27, at fifty cents — see `on:`.)
#               This is the half that says which shelves are thinnest, and
#               which ones are resting (bjt/shelf_rest.ts).
#   write     — actually generate, gate, check and commit those items, and open a
#               pull request that records the night. Runs only when the secrets
#               it needs are present. A manual run can ask for the difficulty
#               probe instead (the "probe" input, `bjt probe --all`): it
#               measures the questions already in the bank rather than writing
#               new ones, under the same ceilings, into the same kind of pull
#               request.
#   publish   — run the `checks` workflow on tonight's branch, and when every
#               job is green, merge the pull request and start the **deploy
#               database** workflow. A red check, or a `main` that moved while
#               the night ran, leaves the pull request open with a comment
#               saying why, for a person.
#
# Splitting it that way is deliberate. A job that does nothing until somebody
# buys an API key is a job nobody notices has rotted; this one produces a true,
# useful report from the first night, and grows teeth when the key arrives.
#
# **Why a pull request, when nobody reviews it.** Until 2026-10-02 a person read
# each night's pull request before merging it. The owner chose then to stop
# reviewing nightly content by hand: every item has already passed the
# answerability gate, the proofreader and the whole-batch checks, and the
# `checks` workflow on the branch (the bank's sweeps, the schema and every
# bundle applied twice to a local D1) is now the gate. The pull request stays
# because it is the record: one per night, with the night's summary, that
# can be read, reverted or withdrawn from (batches/withdrawn.txt) later.
#
# Why the night calls the checks and the deploy itself: a pull request opened,
# and a merge made, with the workflow's own token start no other workflow, so
# neither the pull request's checks nor the push to `main` would run. The
# publish jobs below ask for both explicitly.
#
# Secrets, all optional, each unlocking one thing:
#
#   ANTHROPIC_API_KEY  the generator. Without it only the survey runs.
#   SEEDS_TAR_B64      optional: the licensed few-shot and vocabulary material
#                      that lives in the gitignored seeds/. Produce it with
#                        tar czf - seeds | base64 -w0
#                      Without it the job builds seeds/ from the reference
#                      batches instead (`bjt seeds --bootstrap`): the bank's own
#                      hand-written, owner-reviewed items become the few-shot
#                      examples. That is a weaker signal than official material
#                      and the run summary says which one was used; it is a much
#                      stronger one than no examples, which is what a job that
#                      refused to run would leave the bank with.
#   CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
#                      a token allowed to edit D1, and the account it is in.
#                      Used for one file — d1/refresh_item_stats.sql — which
#                      recounts how often each item is answered correctly across
#                      all learners. That is what the practice queue reads to
#                      pitch a set at a difficulty that teaches. Also applies
#                      batches/scenes.sql once artwork has been uploaded (below).
#   OPENAI_API_KEY     the image model that draws the pictures. With it (and
#                      ANTHROPIC_API_KEY, which reviews every draft against the
#                      brief) the job draws whichever of the sixteen bank scenes
#                      has no picture yet (Sundays), and every night the picture
#                      of each new 画像把握 item, which is reviewed against the
#                      item's own four descriptions and is what makes the item
#                      servable. A picture refused too often is given up on,
#                      and the bucket remembers (rejected/).
#   R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY
#                      an R2 token's S3 pair, which lets the job put approved
#                      artwork in the media bucket and see what is already
#                      there (bjt/r2.ts). It is the one key that writes media:
#                      it lives here and in nobody's .env, and never in client/.
#                      Pictures are drawn only when the bucket can be read: a
#                      job that cannot see what is drawn would draw it all
#                      again. And not while the bucket's scenes/ folder is
#                      empty — that is a bucket that has lost its library, not
#                      one to redraw.
#   TYPESAFE_API_KEY   Jev, the prototype difficulty instrument (bjt/jev.ts).
#                      With it a manual run can compare Jev with the probe's
#                      own model ("compare_jev"), which writes nothing. Jev
#                      becomes the probe only when the repository variable
#                      BJT_DIFFICULTY_MODEL is set to jev-latest (Settings →
#                      Secrets and variables → Actions → Variables); unset, the
#                      probe stays on the proofreader's model.
#
# The scene step is the one place in this file a machine's judgement ships
# something without a person reading it first. The owner asked for that
# (2026-09-17). What stands in for the person is a second model checking each
# draft against the same four rules a human reviewer would apply, and every
# rejected draft is kept in the run's artifact with its reason, so the gate
# can be audited after the fact. A scene that fails every attempt ships with
# no picture, which the app has always allowed.
name: nightly

on:
  # The owner turned the nights back on (2026-09-27), asking that they stay
  # very cheap: two items at most (three until 2026-10-08), reading first,
  # and never more than fifty cents a night — see BJT_RUN_BUDGET_USD below.
  # They had been off since 2026-09-25, when every night cost API money for
  # questions the app was used too little to need. A manual run from the
  # Actions tab still works, with the same defaults.
  #
  # The Sunday bank-scene run below keys on the scheduled event, so it is back
  # with the schedule; a manual run with "scenes" ticked still draws them.
  schedule:
    # 16:17 UTC = 01:17 JST, so the night is over before anybody practises.
    # GitHub starts a scheduled run late, worst at the top of the hour: the
    # 18:00 UTC schedule ran 2.5 to 4.5 hours late every night in late
    # September (05:30 to 07:40 JST, with the deploy after it). An odd minute
    # and two hours' head start keep even that delay before 06:00 JST.
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Most items this run may write"
        required: false
        default: "2"
      per_slot:
        description: "Most items into any one (type, level)"
        required: false
        default: "1"
      reading_min:
        description: "Items reserved for the reading shelves before the rest (they need no audio or picture)"
        required: false
        default: "1"
      scenes:
        description: "Also draw the shared bank's missing scenes (item pictures are drawn on every run)"
        type: boolean
        required: false
        default: false
      probe:
        description: "Instead of writing items, measure the difficulty of the live questions that have none, or a rate of an older kind (bjt probe --all): same ceilings, a pull request as usual, no pictures"
        type: boolean
        required: false
        default: false
      regate:
        description: "Instead of writing items, put live questions that skipped the proofreader and the gate through both (bjt regate --all --withdraw): same ceilings; a run that proposes withdrawals waits for a person to merge"
        type: boolean
        required: false
        default: false
      compare_jev:
        description: "Instead of writing items, measure a sample of live questions with the probe's model and with Jev side by side (bjt probe --compare jev-latest): writes nothing, opens no pull request"
        type: boolean
        required: false
        default: false
      max_usd:
        description: "Most dollars this run may spend on the Anthropic API (measured from usage; the run stops with what it has)"
        required: false
        default: "0.5"
      dry_run:
        description: "Print the work order and stop"
        type: boolean
        required: false
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

# Nothing by default. Each job below asks for what it needs: the night for
# pushing tonight's branch and opening the pull request, the checks for
# reading, the merge for merging and starting the deploy.
permissions:
  contents: read

jobs:
  nightly:
    name: survey the bank, and fill it if the keys are there
    # Whether a night runs is decided by `main` alone (CLAUDE.md): the schedule
    # always runs on the default branch, and a manual run from any other
    # branch would spend the keys on that branch's code and ceilings.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # What the publish jobs below need: tonight's branch, its pull request, and
    # what `main` was when the branch was put on top of it. All empty when the
    # night opened no pull request.
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      pr: ${{ steps.pr.outputs.pr }}
      base: ${{ steps.pr.outputs.base }}
      # true when the pull request withdraws questions: a person merges it.
      hold: ${{ steps.pr.outputs.hold }}
    # A night is minutes, not hours. The morning of 2026-09-18 a single run
    # generated for two and a half hours. The process stops itself at
    # BJT_RUN_MAX_MINUTES (30) and keeps what it wrote; this clock, a little
    # above it, is the guard that does not depend on any code being right.
    timeout-minutes: 45
    env:
      # Two a night, one to a shelf: the owner would rather have one or two
      # questions that are right than three (2026-10-08). It was eight until
      # the owner said the app is used far less than that fills (2026-09-24),
      # then three. The code clamps whatever is typed here to
      # BJT_NIGHT_MAX_BUDGET / _PER_SLOT.
      BUDGET: ${{ github.event.inputs.budget || '2' }}
      PER_SLOT: ${{ github.event.inputs.per_slot || '1' }}
      # Reading items first: no audio, no picture, the cheapest item there is,
      # and the owner asked for them every night (2026-09-19). At least one.
      READING_MIN: ${{ github.event.inputs.reading_min || '1' }}
      # The most this run may spend, checked before every call against the
      # usage the API reports. Reached, the run stops and keeps what it wrote.
      # Fifty cents, the owner's price for a night (2026-09-27): two items on
      # Sonnet fit under it when the drafts go well, and when a shelf needs its
      # retries the night stops short and ships what it has, which is the trade
      # the owner chose. A scheduled run has no inputs, so this fallback is the
      # nightly price; the max_usd default above says the same for a manual run.
      # The ceiling is for the night: the scene step's review calls continue
      # the ledger the writing step started (BJT_SPEND_LEDGER, set in the
      # first step below), and the image model's own bill is held down by
      # BJT_NIGHT_MAX_PICTURES and the lifetime allowance, not by this.
      BJT_RUN_BUDGET_USD: ${{ github.event.inputs.max_usd || '0.5' }}
      # Which model measures difficulty, for tonight's items and a probe run
      # alike, so the bank carries one kind of rate. A repository variable, so
      # switching to Jev is a setting changed after reading a comparison run,
      # not a code change; unset (empty here), config.ts's default applies.
      BJT_DIFFICULTY_MODEL: ${{ vars.BJT_DIFFICULTY_MODEL }}
    steps:
      # No token left in .git/config for the steps that run generated code
      # and model output. The one step that pushes is handed credentials of
      # its own, at the end.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      # One ledger for the whole night. The run's ceilings (BJT_RUN_BUDGET_USD,
      # the call count, the clock) are kept per process; with this file the
      # scene step's review calls continue the budget and the clock that
      # `bjt nightly` or `bjt probe` started, rather than starting a fresh fifty
      # cents of their own. Set here rather than in the job's `env:`, where
      # the runner's temporary directory is not yet known.
      - name: one spending ledger for the night
        run: echo "BJT_SPEND_LEDGER=$RUNNER_TEMP/bjt-spend.json" >> "$GITHUB_ENV"

      # ---------------------------------------------------------- the survey

      # The R2 pair lets the plan read the shelf ledger (bjt/shelf_rest.ts), so
      # it shows the order tonight will actually run: a shelf that has written
      # nothing night after night is passed over, and the plan says so.
      - name: what the bank needs next
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          {
            echo '## The bank tonight'
            echo
            echo '```'
            node bjt/main.ts plan --budget "$BUDGET" --per-slot "$PER_SLOT" --reading-min "$READING_MIN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node bjt/main.ts plan --budget "$BUDGET" --per-slot "$PER_SLOT" --reading-min "$READING_MIN" --json > plan.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-order
          path: plan.json

      # --------------------------------------------------- which half can run

      # A step's own `env:` is not visible to its own `if:`, so the secrets are
      # turned into plain outputs here and every conditional below reads those.
      # Only the presence of each secret ever leaves this step.
      - name: which of tonight's work is unlocked
        id: keys
        env:
          HAVE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAVE_SEEDS: ${{ secrets.SEEDS_TAR_B64 != '' }}
          HAVE_DB: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAVE_IMAGES: ${{ secrets.OPENAI_API_KEY != '' }}
          HAVE_STORAGE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAVE_TYPESAFE: ${{ secrets.TYPESAFE_API_KEY != '' }}
          # Read only to count what the bucket already holds (below).
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "db=$HAVE_DB" >> "$GITHUB_OUTPUT"
          echo "storage=$HAVE_STORAGE" >> "$GITHUB_OUTPUT"
          # Two kinds of picture. The shared bank is drawn once a week (the
          # Sunday run), or when a manual run asks: every night was the first
          # ten dollars, and the bank is one scene from complete. A 画像把握
          # item's own picture is drawn every night, because the item is not
          # served until it exists and the bucket's ledger caps how many
          # drafts any picture may ever cost (BJT_SCENE_LIFETIME_ATTEMPTS).
          weekly=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; then weekly=true; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ github.event.inputs.scenes }}" = "true" ]; then weekly=true; fi
          # A manual run may ask for the difficulty probe instead of a night's
          # writing. It measures questions already in the bank and does nothing
          # else: no new items, no pictures, nothing pointed at in the database.
          # Only a manual run has inputs, so a scheduled night is never a probe.
          probe=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ github.event.inputs.probe }}" = "true" ]; then probe=true; fi
          # Or the regate: the proofreader and the gate, over live questions
          # that were imported without either (bjt/regate.ts). It wins over
          # "probe" when both are ticked: a question worth withdrawing is not
          # worth measuring.
          regate=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ github.event.inputs.regate }}" = "true" ]; then regate=true; probe=false; fi
          # Or it may compare the probe's model with Jev, which writes nothing
          # at all: no items, no rates, no pictures, no pull request. It wins
          # over "probe" when both are ticked, being the one that changes less.
          compare=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ github.event.inputs.compare_jev }}" = "true" ]; then compare=true; probe=false; regate=false; fi
          # The bucket must be readable, and must already hold the library:
          # a job that cannot see what has been drawn would pay to draw all of
          # it again.
          drawn=0
          if [ "$HAVE_STORAGE" = "true" ]; then
            drawn=$(node --input-type=module -e 'const { Bucket } = await import("./bjt/scene_art.ts"); console.log((await new Bucket().list()).size)' || echo error)
          fi
          if [ "$probe" = "true" ]; then
            echo "art=false" >> "$GITHUB_OUTPUT"
          elif [ "$regate" = "true" ]; then
            echo "art=false" >> "$GITHUB_OUTPUT"
          elif [ "$compare" = "true" ]; then
            echo "art=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAVE_API_KEY" = "true" ] && [ "$HAVE_IMAGES" = "true" ] && { [ "$HAVE_STORAGE" != "true" ] || [ "$drawn" = "error" ] || [ "$drawn" = "0" ]; }; then
            echo "art=false" >> "$GITHUB_OUTPUT"
            {
              echo
              echo '### No pictures drawn'
              echo
              if [ "$HAVE_STORAGE" != "true" ]; then
                echo 'The media bucket cannot be read without `R2_ACCESS_KEY_ID` and `R2_SECRET_ACCESS_KEY`,'
                echo 'and a job that cannot see what has been drawn would draw all of it again.'
              elif [ "$drawn" = "error" ]; then
                echo 'The media bucket could not be listed tonight (see this step'"'"'s log).'
              else
                echo 'The bucket has no scene picture. A bucket that has lost its library is not'
                echo 'one to redraw; nothing is drawn until the pictures are back.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAVE_API_KEY" = "true" ] && [ "$HAVE_IMAGES" = "true" ]; then
            echo "art=true" >> "$GITHUB_OUTPUT"
            if [ "$weekly" = "true" ]; then
              echo "only=" >> "$GITHUB_OUTPUT"
            else
              echo "only=--only pictures" >> "$GITHUB_OUTPUT"
              {
                echo
                echo '### Shared bank not drawn tonight'
                echo
                echo 'Bank scenes are drawn on the Sunday run, or on a manual run with "scenes" ticked;'
                echo 'the pictures of new 画像把握 items are drawn every night.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "art=false" >> "$GITHUB_OUTPUT"
            {
              echo
              echo '### No pictures drawn'
              echo
              echo "Drawing pictures needs both \`ANTHROPIC_API_KEY\` (present: $HAVE_API_KEY)"
              echo "and \`OPENAI_API_KEY\` (present: $HAVE_IMAGES). See blockers.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "seeds=$HAVE_SEEDS" >> "$GITHUB_OUTPUT"
          # go: the key is here, so something may be spent and a pull request
          # may follow. write / probe / regate: which of the three that
          # something is. compare: spends, and leaves nothing to commit, so
          # never `go`.
          echo "regate=false" >> "$GITHUB_OUTPUT"
          if [ "$compare" = "true" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "write=false" >> "$GITHUB_OUTPUT"
            echo "probe=false" >> "$GITHUB_OUTPUT"
            if [ "$HAVE_API_KEY" = "true" ] && [ "$HAVE_TYPESAFE" = "true" ]; then
              echo "compare=true" >> "$GITHUB_OUTPUT"
            else
              {
                echo
                echo '### Nothing compared'
                echo
                echo "Comparing with Jev needs \`ANTHROPIC_API_KEY\` (present: $HAVE_API_KEY)"
                echo "and \`TYPESAFE_API_KEY\` (present: $HAVE_TYPESAFE)."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$HAVE_API_KEY" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            if [ "$regate" = "true" ]; then
              echo "write=false" >> "$GITHUB_OUTPUT"
              echo "probe=false" >> "$GITHUB_OUTPUT"
              echo "regate=true" >> "$GITHUB_OUTPUT"
            elif [ "$probe" = "true" ]; then
              echo "write=false" >> "$GITHUB_OUTPUT"
              echo "probe=true" >> "$GITHUB_OUTPUT"
            else
              echo "write=true" >> "$GITHUB_OUTPUT"
              echo "probe=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "write=false" >> "$GITHUB_OUTPUT"
            echo "probe=false" >> "$GITHUB_OUTPUT"
            {
              echo
              echo '### Nothing written'
              echo
              echo "Generation needs \`ANTHROPIC_API_KEY\` (present: $HAVE_API_KEY). See blockers.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ------------------------------------------------ recount the shared bank

      # Aggregate over every learner, and the only thing in this repository that
      # gets better with scale: the more people answer an item, the better the
      # queue knows how hard it is. One statement, as the service role, out of
      # hours — never on the path of somebody waiting for five questions.
      - name: recount how hard each item is
        if: steps.keys.outputs.db == 'true' && github.event.inputs.compare_jev != 'true'
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4.131.1 d1 execute business-japanese-drill --remote --yes \
            --file ../d1/refresh_item_stats.sql

      # --------------------------------------------------------- the generation

      - name: unpack the licensed seeds
        if: steps.keys.outputs.write == 'true' && steps.keys.outputs.seeds == 'true' && github.event.inputs.dry_run != 'true'
        env:
          SEEDS_TAR_B64: ${{ secrets.SEEDS_TAR_B64 }}
        run: |
          # seeds/ is gitignored on purpose — it is licensed material. It arrives
          # as a secret, is unpacked into the workspace, and never reaches a
          # commit: .gitignore already covers it, and the commit below adds only
          # batches/.
          echo "$SEEDS_TAR_B64" | base64 -d | tar xzf -
          node bjt/main.ts seeds

      - name: build seeds from the reference batches
        if: steps.keys.outputs.write == 'true' && steps.keys.outputs.seeds != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          # No licensed material tonight. The bank's own hand-written items are
          # the few-shot examples instead; the summary says so, so a reader of
          # the pull request knows what the model was shown.
          node bjt/main.ts seeds --bootstrap
          {
            echo
            echo '### Seeds'
            echo
            echo 'No `SEEDS_TAR_B64` secret: few-shot examples were taken from the reference'
            echo 'batches in `batches/` (`bjt seeds --bootstrap`). No official items, kanji'
            echo 'tiers or level descriptors were available to the generator.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: write tonight's items
        if: steps.keys.outputs.write == 'true' && github.event.inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # The shelf ledger: read to rest a shelf that keeps writing nothing,
          # and written with what each shelf did tonight (bjt/shelf_rest.ts).
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node bjt/main.ts nightly --budget "$BUDGET" --per-slot "$PER_SLOT" --reading-min "$READING_MIN" --summary summary.md

      # The manual alternative to the step above: the difficulty prior the
      # bank's imported questions never got (bjt/backfill.ts). The same run
      # ceilings as a night, from the env at the top of this job, and the same
      # artifact, checks and pull request below: it rewrites bundles and their
      # SQL, and nothing reaches the database until somebody merges. It skips
      # what already has a rate, so a bank bigger than one run's ceiling is a
      # few runs, never a raised ceiling.
      - name: measure the difficulty the bank is missing
        if: steps.keys.outputs.probe == 'true' && github.event.inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node bjt/main.ts probe --all --summary summary.md

      # The other manual alternative: the review the imported questions never
      # had (bjt/regate.ts). The same ceilings as a night; every verdict goes
      # into batches/regated.txt as it is reached, so the next run starts where
      # this one stopped, once this run's pull request is merged. A failure is
      # appended to batches/withdrawn.txt with its bundle's SQL rewritten, and
      # that pull request is left for a person (the publish job below): a
      # withdrawal is a decision, and blockers.md asks that each be read.
      # `regate` prints its own summary; it is kept for the pull request.
      - name: re-check the questions that skipped the gate
        if: steps.keys.outputs.regate == 'true' && github.event.inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          status=0
          node bjt/main.ts regate --all --withdraw 2>&1 | tee regate.txt || status=$?
          {
            echo '## Regate: the proofreader and the gate, after the fact'
            echo
            echo '```'
            grep -v '^  would check\|^[^ ]*\.json: ' regate.txt || true
            echo '```'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The evidence for switching the probe to Jev: the default model and Jev
      # on the same sample of live questions, a type at a time, under the same
      # ceilings. No bundle, no SQL, no pull request; the table is this run's
      # summary. The baseline is pinned to the default whatever the variable
      # says, so the comparison means the same thing after a switch.
      - name: compare the difficulty probe with Jev
        if: steps.keys.outputs.compare == 'true' && github.event.inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BJT_DIFFICULTY_MODEL: ""
        run: |
          status=0
          node bjt/main.ts probe --all --compare jev-latest --summary compare.md || status=$?
          if [ -f compare.md ]; then cat compare.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status

      # Whatever happens after this point — a push refused, a pull request
      # not permitted, the job killed by its own clock — the items that were
      # paid for are in the run's artifact. Eight items were lost this way on
      # 2026-09-18, and lost items are the most expensive kind.
      - name: keep tonight's work whatever happens next
        if: always() && steps.keys.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tonight-batches
          path: |
            batches
            summary.md
          if-no-files-found: ignore

      # The same sweep the `checks` workflow runs, over the whole of batches/ and
      # not only tonight's. A new bundle that breaks an old one's dedupe distance
      # is exactly the failure this catches, and it is invisible to a per-batch
      # check.
      - name: check every bundle, old and new
        if: steps.keys.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          shopt -s nullglob
          for f in batches/*.json; do
            case "$f" in *.source.json) continue ;; esac
            echo "::group::$f"
            node bjt/main.ts checkbatch "$f"
            echo "::endgroup::"
          done

      # ------------------------------------------------------- the scene bank

      # Draw whichever scenes have no picture, review each draft, upload what
      # passed. The bucket listing is what makes this idempotent: on a fresh
      # runner media/ is empty, and the bucket is the only record of what was
      # drawn on an earlier night. That is why nothing is drawn at all without
      # the storage secrets (`art` is false then; see the step that sets it).
      #
      # After the generation, not before: the survey reads batches/ in this
      # checkout, so a 画像把握 item written tonight gets its picture tonight,
      # and the pull request carries the item, the picture's SQL, and the
      # picture already in the bucket. The row scenes.sql inserts for it is a
      # scene with a picture and no item yet; publishing the item on merge
      # attaches the two.
      - name: draw the scenes the bank is missing
        if: steps.keys.outputs.art == 'true' && github.event.inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          upload=""
          if [ "${{ steps.keys.outputs.storage }}" = "true" ]; then upload="--upload --sql"; fi
          # A scene that fails every attempt is reported, not fatal: the app
          # ships items without pictures, and the next night tries again.
          node bjt/main.ts scenes --generate --provider openai ${{ steps.keys.outputs.only }} $upload --summary scenes.md || true
          cat scenes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.keys.outputs.art == 'true' && github.event.inputs.dry_run != 'true'
        with:
          name: scene-artwork
          path: media/scenes
          if-no-files-found: ignore

      # The scene step above is allowed to fail — a bank picture is optional,
      # and an item picture waits for the next night — and when it dies before
      # writing the SQL, this step must not be the one that ends the night: the
      # items are already written and checked, and the pull request is next.
      - name: point the database at the artwork
        if: steps.keys.outputs.art == 'true' && steps.keys.outputs.storage == 'true' && steps.keys.outputs.db == 'true' && github.event.inputs.dry_run != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ ! -f batches/scenes.sql ]; then
            {
              echo
              echo '### Artwork not applied'
              echo
              echo 'The scene step did not write `batches/scenes.sql` (see its output above);'
              echo 'the database was not pointed at any new picture tonight.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          (cd client && npx --yes wrangler@4.131.1 d1 execute business-japanese-drill --remote --yes \
            --file ../batches/scenes.sql)

      # What testers reported that is still live, for the night's pull request
      # (bjt/reports.ts). One SELECT, and no user id in it: the night reads the
      # reports and decides nothing, since a report is not a veto; taking a
      # question out is still a line in batches/withdrawn.txt. Allowed to fail:
      # a night is never lost over reports it could not read.
      - name: list the questions testers reported
        if: steps.keys.outputs.db == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          query=$(node bjt/main.ts reports --query)
          (cd client && npx --yes wrangler@4.131.1 d1 execute business-japanese-drill --remote --json \
            --command "$query") > reports.json
          node bjt/main.ts reports reports.json --summary reports.md
          if [ -s reports.md ]; then cat reports.md >> "$GITHUB_STEP_SUMMARY"; fi

      # batches/scenes.sql is included when the scene step wrote it, so the
      # pull request also records which pictures the database was pointed at.
      - name: open the night's pull request
        id: pr
        if: (steps.keys.outputs.go == 'true' || steps.keys.outputs.art == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain batches)" ]; then
            echo "nothing new in batches/; no pull request" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The run number keeps two runs on one date apart: a manual run in
          # the afternoon and the scheduled one that night used to want the
          # same branch, and the second push was refused with its items on it.
          branch="content/nightly-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          # A probe run measured questions already in the bank; a night wrote
          # new ones. The commit and the title say which; nothing else differs.
          hold=false
          if [ "${{ steps.keys.outputs.regate }}" = "true" ]; then
            if [ -n "$(git status --porcelain batches/withdrawn.txt)" ]; then
              hold=true
              subject="Re-check imported questions, and propose withdrawals"
              body="Written by bjt regate --all --withdraw. The verdicts are in batches/regated.txt; the questions that failed are appended to batches/withdrawn.txt and their bundles' SQL rewritten. Not merged automatically: read each proposed withdrawal, delete the line to keep a question and mark it overruled in regated.txt, then merge by hand. Merging this before the next regate run is what lets that run start where this one stopped."
            else
              subject="Re-check imported questions"
              body="Written by bjt regate --all --withdraw. Every question checked passed; the verdicts are in batches/regated.txt and nothing is withdrawn. The nightly workflow merges it once the checks pass on this branch, so the next regate run starts where this one stopped."
            fi
            title="Regate: $(date -u +%Y-%m-%d)"
          elif [ "${{ steps.keys.outputs.probe }}" = "true" ]; then
            subject="Measure the difficulty of the questions that have none"
            body="Written by the difficulty probe (bjt probe --all). It sets model_p_correct on live questions that shipped without one, or with a rate of an older kind than the probe writes now. The nightly workflow merges it once the checks pass on this branch, and the deploy applies the SQL."
            title="Difficulty probe: $(date -u +%Y-%m-%d)"
          else
            subject="Fill the emptiest shelves of the bank"
            body="Written by the nightly job. Every item passed the per-item answerability gate and the whole-batch checks. The nightly workflow merges it once the checks pass on this branch, and the deploy applies the SQL. Scene artwork, if any, passed the review gate and is already in the bucket."
            title="Nightly content: $(date -u +%Y-%m-%d)"
          fi
          git config user.name  "bjt nightly"
          git config user.email "noreply@github.com"
          # The checkout kept no credentials, so git gets them here, for the
          # fetch and the push below, from GH_TOKEN through the gh CLI.
          gh auth setup-git
          git checkout -b "$branch"
          git add batches
          git commit -m "$subject ($(date -u +%Y-%m-%d))" -m "$body"
          # The run checked out the default branch as it was hours ago. If it
          # has moved since — and on 2026-09-18 it moved by an edit to this
          # very file — a branch pushed from the old base is refused as an
          # unauthorised workflow change, and the night is lost. Put tonight's
          # one commit on top of the branch as it is now; it adds files, so
          # a conflict means main grew a bundle of the same name meanwhile,
          # which a person has to look at (the artifact above has the files).
          default="${{ github.event.repository.default_branch }}"
          git fetch origin "$default"
          if ! git rebase "origin/$default"; then
            git rebase --abort
            echo "::error::tonight's bundle conflicts with $default; see the tonight-batches artifact"
            exit 1
          fi
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse "origin/$default")" >> "$GITHUB_OUTPUT"
          echo "hold=$hold" >> "$GITHUB_OUTPUT"
          [ -f summary.md ] || echo "Nightly run: scene artwork only." > summary.md
          [ -f scenes.md ] && { echo; cat scenes.md; } >> summary.md
          [ -s reports.md ] && { echo; cat reports.md; } >> summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          # The items are safe on the branch by now. If the repository does not
          # let Actions open pull requests, say so and how to fix it, and hand
          # over the link — a night's work is not lost over a settings toggle.
          if url=$(gh pr create \
            --title "$title" \
            --body-file summary.md \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch"); then
            echo "pr=$url" >> "$GITHUB_OUTPUT"
          else
            {
              echo
              echo '### Pull request not opened'
              echo
              echo "Tonight's items are pushed on \`$branch\`, but GitHub would not let this"
              echo 'workflow open the pull request. Either open it by hand:'
              echo
              echo "https://github.com/${GITHUB_REPOSITORY}/pull/new/${branch}"
              echo
              echo 'or allow it once, under Settings → Actions → General → Workflow'
              echo 'permissions → "Allow GitHub Actions to create and approve pull requests".'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------- publishing
  #
  # The `checks` workflow, whole, on tonight's branch: the pipeline's tests and
  # the bank's sweeps, every bundle through checkbatch, the schema with every
  # batches/*.sql applied twice to a local D1, and the app. It is what a push to
  # `main` would have run, run before the merge instead of after it.
  verify:
    name: the checks, on tonight's branch
    needs: nightly
    if: needs.nightly.outputs.pr != ''
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.nightly.outputs.branch }}

  # Green: merge, and start the deploy, which a merge made with this token
  # would not start on its own. The deploy runs the commit `main` is at, so it
  # is started only when that is the merge just made; a push that landed in
  # between brings its own checks and deploy, which include tonight's bundles.
  # A `main` that moved while the night ran is not merged into at all: the
  # checks above saw tonight's branch on top of an older `main`, and the
  # combination nobody has checked is for a person to merge.
  #
  # Except a regate that withdraws questions: that one is a decision, and the
  # merge is the person's (blockers.md). The checks above still run on it.
  publish:
    name: merge tonight's pull request and deploy it
    needs: [nightly, verify]
    if: needs.nightly.outputs.pr != '' && needs.nightly.outputs.hold != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.nightly.outputs.pr }}
      BRANCH: ${{ needs.nightly.outputs.branch }}
      BASE: ${{ needs.nightly.outputs.base }}
      DEFAULT: ${{ github.event.repository.default_branch }}
    steps:
      - name: merge, then deploy
        run: |
          set -euo pipefail
          now=$(gh api "repos/$GH_REPO/commits/$DEFAULT" --jq .sha)
          if [ "$now" != "$BASE" ]; then
            gh pr comment "$PR" --body "Not merged automatically: \`$DEFAULT\` moved while tonight's run was checking this branch, so the checks saw it on top of an older \`$DEFAULT\`. Merge it by hand; the push will run the checks and the deploy."
            echo "### Not merged: $DEFAULT moved during the night ($PR)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # GitHub may still be working out whether it can merge; give it a
          # moment rather than leave a green night unmerged.
          for attempt in 1 2 3; do
            if gh pr merge "$PR" --merge; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
          merged=$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH" > /dev/null || true
          # The pull_request run GitHub held for approval on this pull request
          # (see the top of checks.yml) ran no job and checked nothing; it
          # turns red when the pull request closes, on every night, and a red
          # X that means nothing hides one that does. The verdict is the
          # verify job above. Delete the held run once it has settled. Best
          # effort: a run still settling after this is left, and says nothing.
          for attempt in 1 2 3 4; do
            sleep 5
            held=$(gh api "repos/$GH_REPO/actions/workflows/checks.yml/runs?event=pull_request&branch=$BRANCH" \
                     --jq '.workflow_runs[] | select(.status == "completed") | .id' || true)
            [ -n "$held" ] || continue
            for id in $held; do
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" > /dev/null || true
            done
            break
          done
          head=$(gh api "repos/$GH_REPO/commits/$DEFAULT" --jq .sha)
          if [ "$head" = "$merged" ]; then
            gh workflow run deploy-db.yml --ref "$DEFAULT"
            echo "### Merged $PR and started the deploy" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Merged $PR; $DEFAULT moved on since, and that push deploys it" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Red, or a merge GitHub refused: the pull request stays open, and says so
  # where its reader will look.
  held:
    name: leave tonight's pull request for a person
    needs: [nightly, verify, publish]
    if: failure() && needs.nightly.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.nightly.outputs.pr }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: say why it was not merged
        run: |
          gh pr comment "$PR" --body "Not merged automatically: the checks on this branch, or the merge itself, failed ($RUN). Nothing from it is live. Fix or close it by hand."
