# The nightly job: measure the bank, then grow it where it is thinnest.
#
# It has two halves, and the first one needs nothing at all.
#
#   survey    — count the library shelf by shelf (ten problem types × three
#               levels) and print the work order `bjt nightly` would execute.
#               Offline, no key, runs on every run whatever else is configured.
#               (Runs are manual only since 2026-09-25 — see `on:` below.)
#               This is the half that tells you the practice queue cannot
#               interleave across types because sixteen of the shelves are empty.
#   write     — actually generate, gate, check and commit those items, and open a
#               pull request for a person to read. Runs only when the secrets it
#               needs are present.
#
# Splitting it that way is deliberate. A job that does nothing until somebody
# buys an API key is a job nobody notices has rotted; this one produces a true,
# useful report from the first night, and grows teeth when the key arrives.
#
# **Why a pull request, in a repository whose rule is "work on main".** That rule
# is about people writing code with no gate in front of them. This is a machine
# writing exam content, and the roadmap is explicit that it must be drafts only,
# with a reviewer publishing (docs/content-media-and-auth-roadmap.md). A branch
# that exists to be read before it lands is the gate, not a way around one.
# Nothing here touches the database: it writes bundles and the SQL for them, and
# applying that SQL stays a deliberate act somebody takes.
#
# Secrets, all optional, each unlocking one thing:
#
#   ANTHROPIC_API_KEY  the generator. Without it only the survey runs.
#   SEEDS_TAR_B64      optional: the licensed few-shot and vocabulary material
#                      that lives in the gitignored seeds/. Produce it with
#                        tar czf - seeds | base64 -w0
#                      Without it the job builds seeds/ from the reference
#                      batches instead (`bjt seeds --bootstrap`): the bank's own
#                      hand-written, owner-reviewed items become the few-shot
#                      examples. That is a weaker signal than official material
#                      and the run summary says which one was used; it is a much
#                      stronger one than no examples, which is what a job that
#                      refused to run would leave the bank with.
#   SUPABASE_DB_URL    a connection string for the production database. Used for
#                      one statement — refresh_item_stats() — which recounts how
#                      often each item is answered correctly across all learners.
#                      That is what the practice queue reads to pitch a set at a
#                      difficulty that teaches. Also applies batches/scenes.sql
#                      once artwork has been uploaded (below).
#   OPENAI_API_KEY     the image model that draws the pictures. With it (and
#                      ANTHROPIC_API_KEY, which reviews every draft against the
#                      brief) the job draws whichever of the sixteen bank scenes
#                      has no picture yet (Sundays), and every night the picture
#                      of each new 画像把握 item, which is reviewed against the
#                      item's own four descriptions and is what makes the item
#                      servable. A picture refused too often is given up on,
#                      and the bucket remembers (rejected/).
#   SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY
#                      the project URL and the service-role key, which together
#                      let the job put approved artwork in the `scenes` bucket
#                      and see what is already there. The service-role key is
#                      the one that bypasses row-level security: it lives here
#                      and in nobody's .env, and never in client/.
#
# The scene step is the one place in this file a machine's judgement ships
# something without a person reading it first. The owner asked for that
# (2026-09-17). What stands in for the person is a second model checking each
# draft against the same four rules a human reviewer would apply, and every
# rejected draft is kept in the run's artifact with its reason, so the gate
# can be audited after the fact. A scene that fails every attempt ships with
# no picture, which the app has always allowed.
name: nightly

on:
  # No schedule (the owner, 2026-09-25). Every night cost API money for
  # questions the app is used too little to need, and they sat on branches
  # nobody opened. The job now runs only when started by hand from the Actions
  # tab. To turn the nights back on, restore:
  #
  #   schedule:
  #     # 18:00 UTC = 03:00 JST, while nobody is practising.
  #     - cron: "0 18 * * *"
  #
  # The Sunday bank-scene run below keys on a scheduled event, so it is off
  # with the schedule; a manual run with "scenes" ticked still draws them.
  workflow_dispatch:
    inputs:
      budget:
        description: "Most items this run may write"
        required: false
        default: "3"
      per_slot:
        description: "Most items into any one (type, level)"
        required: false
        default: "2"
      reading_min:
        description: "Items reserved for the reading shelves before the rest (they need no audio or picture)"
        required: false
        default: "1"
      scenes:
        description: "Also draw the shared bank's missing scenes (item pictures are drawn on every run)"
        type: boolean
        required: false
        default: false
      max_usd:
        description: "Most dollars this run may spend on the Anthropic API (measured from usage; the run stops with what it has)"
        required: false
        default: "1"
      dry_run:
        description: "Print the work order and stop"
        type: boolean
        required: false
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  nightly:
    name: survey the bank, and fill it if the keys are there
    runs-on: ubuntu-latest
    # A night is minutes, not hours. The morning of 2026-09-18 a single run
    # generated for two and a half hours. The process stops itself at
    # BJT_RUN_MAX_MINUTES (30) and keeps what it wrote; this clock, a little
    # above it, is the guard that does not depend on any code being right.
    timeout-minutes: 45
    env:
      # Three a night, two to a shelf: well under a dollar on Sonnet. It was
      # eight until the owner said the app is used far less than that fills
      # (2026-09-24). The code clamps whatever is typed here to
      # BJT_NIGHT_MAX_BUDGET / _PER_SLOT.
      BUDGET: ${{ github.event.inputs.budget || '3' }}
      PER_SLOT: ${{ github.event.inputs.per_slot || '2' }}
      # Reading items first: no audio, no picture, the cheapest item there is,
      # and the owner asked for them every night (2026-09-19). At least one.
      READING_MIN: ${{ github.event.inputs.reading_min || '1' }}
      # The most this run may spend, checked before every call against the
      # usage the API reports. Reached, the run stops and keeps what it wrote.
      # A dollar for three items leaves room for a shelf's retries.
      BJT_RUN_BUDGET_USD: ${{ github.event.inputs.max_usd || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"

      # ---------------------------------------------------------- the survey

      - name: what the bank needs next
        run: |
          {
            echo '## The bank tonight'
            echo
            echo '```'
            python -m bjt plan --budget "$BUDGET" --per-slot "$PER_SLOT" --reading-min "$READING_MIN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python -m bjt plan --budget "$BUDGET" --per-slot "$PER_SLOT" --reading-min "$READING_MIN" --json > plan.json

      - uses: actions/upload-artifact@v4
        with:
          name: work-order
          path: plan.json

      # --------------------------------------------------- which half can run

      # A step's own `env:` is not visible to its own `if:`, so the secrets are
      # turned into plain outputs here and every conditional below reads those.
      # Only the presence of each secret ever leaves this step.
      - name: which of tonight's work is unlocked
        id: keys
        env:
          HAVE_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAVE_SEEDS: ${{ secrets.SEEDS_TAR_B64 != '' }}
          HAVE_DB: ${{ secrets.SUPABASE_DB_URL != '' }}
          HAVE_IMAGES: ${{ secrets.OPENAI_API_KEY != '' }}
          HAVE_STORAGE: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          echo "db=$HAVE_DB" >> "$GITHUB_OUTPUT"
          echo "storage=$HAVE_STORAGE" >> "$GITHUB_OUTPUT"
          # Two kinds of picture. The shared bank is drawn once a week (the
          # Sunday run), or when a manual run asks: every night was the first
          # ten dollars, and the bank is one scene from complete. A 画像把握
          # item's own picture is drawn every night, because the item is not
          # served until it exists and the bucket's ledger caps how many
          # drafts any picture may ever cost (BJT_SCENE_LIFETIME_ATTEMPTS).
          weekly=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; then weekly=true; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ github.event.inputs.scenes }}" = "true" ]; then weekly=true; fi
          if [ "$HAVE_API_KEY" = "true" ] && [ "$HAVE_IMAGES" = "true" ]; then
            echo "art=true" >> "$GITHUB_OUTPUT"
            if [ "$weekly" = "true" ]; then
              echo "only=" >> "$GITHUB_OUTPUT"
            else
              echo "only=--only pictures" >> "$GITHUB_OUTPUT"
              {
                echo
                echo '### Shared bank not drawn tonight'
                echo
                echo 'Bank scenes are drawn on the Sunday run, or on a manual run with "scenes" ticked;'
                echo 'the pictures of new 画像把握 items are drawn every night.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "art=false" >> "$GITHUB_OUTPUT"
            {
              echo
              echo '### No pictures drawn'
              echo
              echo "Drawing pictures needs both \`ANTHROPIC_API_KEY\` (present: $HAVE_API_KEY)"
              echo "and \`OPENAI_API_KEY\` (present: $HAVE_IMAGES). See blockers.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "seeds=$HAVE_SEEDS" >> "$GITHUB_OUTPUT"
          if [ "$HAVE_API_KEY" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            {
              echo
              echo '### Nothing written'
              echo
              echo "Generation needs \`ANTHROPIC_API_KEY\` (present: $HAVE_API_KEY). See blockers.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ------------------------------------------------ recount the shared bank

      # Aggregate over every learner, and the only thing in this repository that
      # gets better with scale: the more people answer an item, the better the
      # queue knows how hard it is. One statement, as the service role, out of
      # hours — never on the path of somebody waiting for five questions.
      - name: install psql
        if: steps.keys.outputs.db == 'true'
        # The runner image ships one; the ten-second apt round trip is only for
        # the day it stops doing so.
        run: |
          command -v psql >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          }

      - name: recount how hard each item is
        if: steps.keys.outputs.db == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "select public.refresh_item_stats() as items_recounted;"

      # --------------------------------------------------------- the generation

      - name: unpack the licensed seeds
        if: steps.keys.outputs.go == 'true' && steps.keys.outputs.seeds == 'true' && github.event.inputs.dry_run != 'true'
        env:
          SEEDS_TAR_B64: ${{ secrets.SEEDS_TAR_B64 }}
        run: |
          # seeds/ is gitignored on purpose — it is licensed material. It arrives
          # as a secret, is unpacked into the workspace, and never reaches a
          # commit: .gitignore already covers it, and the commit below adds only
          # batches/.
          echo "$SEEDS_TAR_B64" | base64 -d | tar xzf -
          python -m bjt seeds

      - name: build seeds from the reference batches
        if: steps.keys.outputs.go == 'true' && steps.keys.outputs.seeds != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          # No licensed material tonight. The bank's own hand-written items are
          # the few-shot examples instead; the summary says so, so a reader of
          # the pull request knows what the model was shown.
          python -m bjt seeds --bootstrap
          {
            echo
            echo '### Seeds'
            echo
            echo 'No `SEEDS_TAR_B64` secret: few-shot examples were taken from the reference'
            echo 'batches in `batches/` (`bjt seeds --bootstrap`). No official items, kanji'
            echo 'tiers or level descriptors were available to the generator.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: write tonight's items
        if: steps.keys.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bjt nightly --budget "$BUDGET" --per-slot "$PER_SLOT" --reading-min "$READING_MIN" --summary summary.md

      # Whatever happens after this point — a push refused, a pull request
      # not permitted, the job killed by its own clock — the items that were
      # paid for are in the run's artifact. Eight items were lost this way on
      # 2026-09-18, and lost items are the most expensive kind.
      - name: keep tonight's work whatever happens next
        if: always() && steps.keys.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tonight-batches
          path: |
            batches
            summary.md
          if-no-files-found: ignore

      # The same sweep the `checks` workflow runs, over the whole of batches/ and
      # not only tonight's. A new bundle that breaks an old one's dedupe distance
      # is exactly the failure this catches, and it is invisible to a per-batch
      # check.
      - name: check every bundle, old and new
        if: steps.keys.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          shopt -s nullglob
          for f in batches/*.json; do
            case "$f" in *.source.json) continue ;; esac
            echo "::group::$f"
            python -m bjt checkbatch "$f"
            echo "::endgroup::"
          done

      # ------------------------------------------------------- the scene bank

      # Draw whichever scenes have no picture, review each draft, upload what
      # passed. The bucket listing is what makes this idempotent: on a fresh
      # runner media/ is empty, and the bucket is the only record of what was
      # drawn on an earlier night. Without the storage secrets the pictures are
      # drawn and kept only in the run's artifact, for a person to upload.
      #
      # After the generation, not before: the survey reads batches/ in this
      # checkout, so a 画像把握 item written tonight gets its picture tonight,
      # and the pull request carries the item, the picture's SQL, and the
      # picture already in the bucket. The row scenes.sql inserts for it is a
      # scene with a picture and no item yet; publishing the item on merge
      # attaches the two.
      - name: draw the scenes the bank is missing
        if: steps.keys.outputs.art == 'true' && github.event.inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          upload=""
          if [ "${{ steps.keys.outputs.storage }}" = "true" ]; then upload="--upload --sql"; fi
          # A scene that fails every attempt is reported, not fatal: the app
          # ships items without pictures, and the next night tries again.
          python -m bjt scenes --generate --provider openai ${{ steps.keys.outputs.only }} $upload --summary scenes.md || true
          cat scenes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.keys.outputs.art == 'true' && github.event.inputs.dry_run != 'true'
        with:
          name: scene-artwork
          path: media/scenes
          if-no-files-found: ignore

      # The scene step above is allowed to fail — a bank picture is optional,
      # and an item picture waits for the next night — and when it dies before
      # writing the SQL, this step must not be the one that ends the night: the
      # items are already written and checked, and the pull request is next.
      - name: point the database at the artwork
        if: steps.keys.outputs.art == 'true' && steps.keys.outputs.storage == 'true' && steps.keys.outputs.db == 'true' && github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ ! -f batches/scenes.sql ]; then
            {
              echo
              echo '### Artwork not applied'
              echo
              echo 'The scene step did not write `batches/scenes.sql` (see its output above);'
              echo 'the database was not pointed at any new picture tonight.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f batches/scenes.sql

      # batches/scenes.sql is included when the scene step wrote it, so the
      # pull request also records which pictures the database was pointed at.
      - name: open a pull request for somebody to read
        if: (steps.keys.outputs.go == 'true' || steps.keys.outputs.art == 'true') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain batches)" ]; then
            echo "nothing new in batches/; no pull request" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The run number keeps two runs on one date apart: a manual run in
          # the afternoon and the scheduled one that night used to want the
          # same branch, and the second push was refused with its items on it.
          branch="content/nightly-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          git config user.name  "bjt nightly"
          git config user.email "noreply@github.com"
          git checkout -b "$branch"
          git add batches
          git commit \
            -m "Fill the emptiest shelves of the bank ($(date -u +%Y-%m-%d))" \
            -m "Written by the nightly job. Every item passed the per-item answerability gate and the whole-batch checks; nothing is published until this is merged and the SQL is applied. Scene artwork, if any, passed the review gate and is already in the bucket."
          # The run checked out the default branch as it was hours ago. If it
          # has moved since — and on 2026-09-18 it moved by an edit to this
          # very file — a branch pushed from the old base is refused as an
          # unauthorised workflow change, and the night is lost. Put tonight's
          # one commit on top of the branch as it is now; it adds files, so
          # a conflict means main grew a bundle of the same name meanwhile,
          # which a person has to look at (the artifact above has the files).
          default="${{ github.event.repository.default_branch }}"
          git fetch origin "$default"
          if ! git rebase "origin/$default"; then
            git rebase --abort
            echo "::error::tonight's bundle conflicts with $default; see the tonight-batches artifact"
            exit 1
          fi
          git push -u origin "$branch"
          [ -f summary.md ] || echo "Nightly run: scene artwork only." > summary.md
          [ -f scenes.md ] && { echo; cat scenes.md; } >> summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          # The items are safe on the branch by now. If the repository does not
          # let Actions open pull requests, say so and how to fix it, and hand
          # over the link — a night's work is not lost over a settings toggle.
          if ! gh pr create \
            --title "Nightly content: $(date -u +%Y-%m-%d)" \
            --body-file summary.md \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch"; then
            {
              echo
              echo '### Pull request not opened'
              echo
              echo "Tonight's items are pushed on \`$branch\`, but GitHub would not let this"
              echo 'workflow open the pull request. Either open it by hand:'
              echo
              echo "https://github.com/${GITHUB_REPOSITORY}/pull/new/${branch}"
              echo
              echo 'or allow it once, under Settings → Actions → General → Workflow'
              echo 'permissions → "Allow GitHub Actions to create and approve pull requests".'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
