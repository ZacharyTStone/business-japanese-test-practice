# Deploy the database: migrations, the committed bank, its audio, and who may
# use it.
#
# Everything the schema needs to reach the real project, so that nobody needs
# the repository on a laptop to bring a project up. Each step is idempotent —
# re-running the workflow on a project that is already current changes nothing
# and says so — which is what makes "run it again" the safe answer to any doubt
# about whether it ran, and what makes it safe to run without being asked:
#
#   by itself   after the `checks` workflow goes green on `main`. A merged
#               nightly pull request is therefore live — items and their audio
#               together — a few minutes after the merge, with nothing further
#               to press. The owner asked for this (2026-09-18); the review
#               gate is the pull request, and a merge is the decision to ship.
#               Only a green run triggers it: a push that fails a check never
#               reaches the database.
#   by hand     from the Actions tab, which is also the only way to add a
#               tester (the form fields exist only there).
#
#   migrations   `supabase db push` against SUPABASE_DB_URL. The CLI records
#                what it applied in supabase_migrations.schema_migrations and
#                applies only what is new next time.
#   the bank     every batches/*.sql, which `bjt publish` wrote as upserts.
#                Includes scenes.sql once the nightly job has drawn artwork.
#   a tester     optional: the email address typed into the run form,
#                added to public.testers with `bjt tester`. The app admits
#                nobody who is not in that table.
#   the audio    optional: every clip the published bank names that the
#                database does not yet point at is synthesised, put in the
#                `audio` bucket, and pointed at. A clip already live is never
#                touched again — the voice a learner first heard is the voice
#                they keep hearing. Runs only with a TTS key and the storage
#                secrets; without them the app keeps showing the text, which
#                it was built to do.
#
# Needs one secret: SUPABASE_DB_URL, the session-pooler connection string with
# the database password in it. The audio step additionally reads OPENAI_API_KEY
# (the library's voice — the owner chose it, and bjt/tts/providers.py records
# that; the same key draws the scene artwork) and SUPABASE_URL +
# SUPABASE_SERVICE_ROLE_KEY, the only key that may write to a bucket. That key
# lives here and in nobody's .env, and never in client/.
name: deploy database

on:
  workflow_run:
    workflows: ["checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tester_email:
        description: "Email address to let into the app (leave blank to add nobody)"
        required: false
        default: ""
      tester_note:
        description: "Who that is (goes in the row)"
        required: false
        default: ""

concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: migrate, publish, admit
    # After `checks`, only a green one; by hand, always.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      # No project yet is an ordinary state on an automatic run — every merge
      # to main would otherwise be a red workflow — and an error on a run
      # somebody started by hand, because they expected it to do something.
      - name: the one secret this needs
        id: db
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$BY_HAND" = "true" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Settings → Secrets and variables → Actions."
            exit 1
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            {
              echo '## Nothing deployed'
              echo
              echo 'No `SUPABASE_DB_URL` secret, so there is no project to deploy to. See blockers.md.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: apply migrations
        if: steps.db.outputs.go == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: publish the committed bank
        if: steps.db.outputs.go == 'true'
        run: |
          shopt -s nullglob
          for f in batches/*.sql; do
            echo "::group::$f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done

      - name: let a tester in
        if: steps.db.outputs.go == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.tester_email != ''
        env:
          EMAIL: ${{ github.event.inputs.tester_email }}
          NOTE: ${{ github.event.inputs.tester_note }}
        run: |
          python -m bjt tester "$EMAIL" --note "$NOTE" > tester.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f tester.sql

      # ---------------------------------------------------------- the audio

      # Nothing is synthesised at practice time; this is the batch job, run at
      # the one moment the bank changes. The database says what is already
      # live, `bjt synth --have` makes only what is missing, `--upload` puts it
      # in the bucket, and the SQL it writes points the rows at the files.
      - name: which voice, if any
        if: steps.db.outputs.go == 'true'
        id: tts
        env:
          HAVE_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAVE_STORAGE: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          if [ "$HAVE_OPENAI" = "true" ] && [ "$HAVE_STORAGE" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            {
              echo '### No audio synthesised'
              echo
              echo "Giving the bank a voice needs \`OPENAI_API_KEY\` (present: $HAVE_OPENAI)"
              echo "and the storage pair \`SUPABASE_URL\` + \`SUPABASE_SERVICE_ROLE_KEY\` (present: $HAVE_STORAGE)."
              echo 'Until then listening items show their text. See blockers.md.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: what is already live
        if: steps.tts.outputs.go == 'true'
        run: |
          psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 \
            -c "select id from public.audio_clips where audio_path is not null" > have.txt
          echo "$(wc -l < have.txt) clip(s) already live"

      - name: give the bank its voice
        if: steps.tts.outputs.go == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          shopt -s nullglob
          failed=0
          for f in batches/*.json; do
            case "$f" in *.source.json) continue ;; esac
            out="${f%.json}.audio.sql"
            rm -f "$out"
            echo "::group::$f"
            # One bundle failing must not stop the rest: its clips are made on
            # the next run, and everything that did reach the bucket is pointed
            # at now.
            python -m bjt synth "$f" --provider openai --have have.txt --upload --out "$out" || failed=1
            if [ -f "$out" ]; then
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$out"
            fi
            echo "::endgroup::"
          done
          {
            echo '### Audio'
            echo
            echo '```'
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "
              select count(*) filter (where audio_path is not null) as clips_live,
                     count(*) filter (where audio_path is null)     as clips_silent,
                     coalesce(sum(duration_ms) / 60000, 0)           as minutes
                from public.audio_clips;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $failed

      - uses: actions/upload-artifact@v4
        if: steps.tts.outputs.go == 'true' && always()
        with:
          name: audio
          path: |
            media/audio
            media/reports
          if-no-files-found: ignore

      - name: what the project holds now
        if: always() && steps.db.outputs.go == 'true'
        run: |
          {
            echo '## The database after this run'
            echo
            echo '```'
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "
              select (select count(*) from supabase_migrations.schema_migrations) as migrations,
                     (select count(*) from public.items where is_published)     as published_items,
                     (select count(*) from public.scenes where image_path is not null) as scenes_with_art,
                     (select count(*) from public.audio_clips where audio_path is not null) as clips_with_audio,
                     (select count(*) from public.testers)                       as testers;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
