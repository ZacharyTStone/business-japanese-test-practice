# Deploy the database: migrations, the committed bank, its audio, and who may
# use it.
#
# Everything the schema needs to reach the real D1 database, so that nobody
# needs the repository on a laptop to bring it up. Each step is idempotent —
# re-running the workflow on a database that is already current changes
# nothing and says so — which is what makes "run it again" the safe answer to
# any doubt about whether it ran, and what makes it safe to run without being
# asked:
#
#   by itself   after the `checks` workflow goes green on `main`. A merged
#               nightly pull request is therefore live — items and their audio
#               together — a few minutes after the merge, with nothing further
#               to press. The owner asked for this (2026-09-18); the review
#               gate is the pull request, and a merge is the decision to ship.
#               Only a green run triggers it: a push that fails a check never
#               reaches the database.
#   by hand     from the Actions tab, which is also the only way to add a
#               tester (the form fields exist only there). From `main` only:
#               the run form lets anybody with write access pick a branch,
#               and a run from any other branch would push that branch's
#               unreviewed migrations to production. It is refused.
#
#   migrations   `wrangler d1 migrations apply --remote`, from d1/migrations.
#                Wrangler records what it applied in the database's
#                d1_migrations table and applies only what is new next time.
#   the bank     every batches/*.sql, which `bjt publish` wrote as upserts,
#                scenes.sql first (an item names its scene). Each file is one
#                all-or-nothing unit.
#   a tester     optional: the email address typed into the run form, added
#                to `testers` with `bjt tester`. The Worker admits nobody who
#                is not in that table. The address is masked in the log, which
#                is public.
#   the audio    optional: every clip the published bank names that the
#                database does not yet point at is synthesised, put in the
#                media bucket in R2, and pointed at. A clip already live is
#                never touched again — the voice a learner first heard is the
#                voice they keep hearing. Runs only with a TTS key and the R2
#                keys; without them the app keeps showing the text, which it
#                was built to do. And only once some clip is live: a database
#                with no live clip has lost track of its library, and recording
#                it all again would replace every voice a learner has heard. A
#                library started from nothing says so on the run form
#                (`first_voice`).
#                The one exception is by hand: `remake_list` on the run form
#                names a committed file of clip ids to record again, for clips
#                made with a delivery that was wrong. It is blank on every
#                automatic run, so nothing is ever replaced unasked, and it
#                replaces only the ids in that file.
#
# Needs two secrets: CLOUDFLARE_API_TOKEN (a token allowed to edit D1) and
# CLOUDFLARE_ACCOUNT_ID. The audio step additionally reads OPENAI_API_KEY (the
# library's voice — the owner chose it, and bjt/tts/providers.ts records that;
# the same key draws the scene artwork) and R2_ACCESS_KEY_ID +
# R2_SECRET_ACCESS_KEY, an R2 token's S3 pair, the only key that may write to
# the bucket. Those live here and in nobody's .env, and never in client/.
name: deploy database

on:
  workflow_run:
    workflows: ["checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tester_email:
        description: "Email address to let into the app (leave blank to add nobody)"
        required: false
        default: ""
      tester_note:
        description: "Who that is (goes in the row)"
        required: false
        default: ""
      remake_list:
        description: "Path to a committed file of clip ids to record AGAIN, replacing the live clip (e.g. batches/remake-20260919-pace.txt). Leave blank — this is for clips made with the wrong delivery"
        required: false
        default: ""
      first_voice:
        description: "Record a library from nothing (only for a database that has never had a live clip and never will be moved in). Leave unticked"
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: migrate, publish, admit
    # By hand, from `main` only: the run form offers every branch, and
    # `wrangler d1 migrations apply` applies whatever migrations the
    # checked-out branch has. After `checks`, three things have to be true, and the last two are
    # what make this workflow safe in a public repository.
    #
    # `branches: [main]` above matches the NAME of the branch the `checks` run
    # was on, and it cannot tell one repository's `main` from another's. A fork
    # keeps the default branch name, so a pull request opened from a fork's
    # `main` produces a `checks` run whose head branch is `main`, and the filter
    # lets it through. The deploy would then run with every secret because a
    # stranger asked. It would deploy THIS repository's code — the checkout
    # below takes the commit the `checks` run passed, which these conditions
    # make a push to this repository's `main`, and never a pull request's head,
    # which is the part that keeps it from being code execution — but it would
    # still reach the production database and spend the TTS key on demand.
    #
    #   green    a push that fails a check never reaches the database.
    #   ours     the `checks` run was on this repository, not on a fork of it.
    #   a push   a pull request's own `checks` run is not a merge, and it is the
    #            merge that is the decision to ship.
    #
    # Nothing legitimate is lost: work lands on `main` as a push (CLAUDE.md), a
    # merged nightly pull request is a push to `main` too, and a pull request's
    # own run never matched `branches: [main]` in the first place.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Migrations, a few hundred upserts and the audio of whatever is new: a
    # normal run is minutes. An hour is the guard that does not depend on any
    # step behaving.
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
      # One wrangler, chosen rather than whichever was published this morning:
      # `migrations apply` is the one step here that changes the production
      # schema. The same version client/package-lock.json pins.
      WRANGLER: npx --yes wrangler@4.131.1
      DB: business-japanese-drill
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        # wrangler.jsonc names the database (and its id); the paths below are
        # relative to client/.
        working-directory: client
    steps:
      # Exactly the commit `checks` passed, not whatever `main` is by the time
      # this starts: a push that lands while the checks are running has not
      # been checked yet, and gets its own deploy when it has. By hand, the
      # commit the run was started on, which the condition above makes `main`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # The pipeline (`node bjt/main.ts …`): the tester SQL and the voices.
      - run: npm ci
        working-directory: .

      # No database yet is an ordinary state on an automatic run — every merge
      # to main would otherwise be a red workflow — and an error on a run
      # somebody started by hand, because they expected it to do something.
      - name: the two secrets this needs
        id: db
        run: |
          if grep -q REPLACE_WITH_THE_D1_DATABASE_ID wrangler.jsonc; then
            # The database has not been created yet, so there is nothing to
            # deploy to; wrangler.jsonc names it once it has.
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo '## Nothing deployed: `client/wrangler.jsonc` has no D1 database id yet. See README.md, Working on it.' >> "$GITHUB_STEP_SUMMARY"
            if [ "$BY_HAND" = "true" ]; then exit 1; fi
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$BY_HAND" = "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set. Settings → Secrets and variables → Actions."
            exit 1
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            {
              echo '## Nothing deployed'
              echo
              echo 'No `CLOUDFLARE_API_TOKEN` / `CLOUDFLARE_ACCOUNT_ID` secret, so there is no database to deploy to. See blockers.md.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: apply migrations
        if: steps.db.outputs.go == 'true'
        run: $WRANGLER d1 migrations apply "$DB" --remote

      # As a file, not a migration: D1 splits a migration into statements on
      # its own side and cuts a trigger body at its first semicolon. Each
      # trigger is dropped and created again, so this is idempotent.
      - name: apply the triggers
        if: steps.db.outputs.go == 'true'
        run: $WRANGLER d1 execute "$DB" --remote --yes --file ../d1/triggers.sql

      - name: publish the committed bank
        if: steps.db.outputs.go == 'true'
        run: |
          shopt -s nullglob
          files=()
          [ -f ../batches/scenes.sql ] && files+=(../batches/scenes.sql)
          for f in ../batches/*.sql; do
            [ "$f" = ../batches/scenes.sql ] || files+=("$f")
          done
          for f in "${files[@]}"; do
            echo "::group::$f"
            $WRANGLER d1 execute "$DB" --remote --yes --file "$f"
            echo "::endgroup::"
          done

      # This repository's Actions logs are public, and a step's `env:` values
      # are printed at the top of its log. So the address and the note are read
      # from the event payload inside the script and masked before anything
      # can echo them — including an error from `bjt tester` or wrangler. The
      # SQL carries the address as `bjt tester` normalises it, so that form is
      # masked too.
      - name: let a tester in
        if: steps.db.outputs.go == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.tester_email != ''
        run: |
          EMAIL=$(jq -r '.inputs.tester_email // ""' "$GITHUB_EVENT_PATH")
          NOTE=$(jq -r '.inputs.tester_note // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$(node -e 'console.log(process.argv[1].trim().toLowerCase())' "$EMAIL")"
          if [ -n "$NOTE" ]; then echo "::add-mask::$NOTE"; fi
          node ../bjt/main.ts tester "$EMAIL" --note "$NOTE" > "$RUNNER_TEMP/tester.sql"
          $WRANGLER d1 execute "$DB" --remote --yes --file "$RUNNER_TEMP/tester.sql" > /dev/null

      # ---------------------------------------------------------- the audio

      # Nothing is synthesised at practice time; this is the batch job, run at
      # the one moment the bank changes. The database says what is already
      # live, `bjt synth --have` makes only what is missing, `--upload` puts it
      # in the bucket, and the SQL it writes points the rows at the files.
      - name: which voice, if any
        if: steps.db.outputs.go == 'true'
        id: tts
        env:
          HAVE_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAVE_STORAGE: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
          FIRST_VOICE: ${{ github.event.inputs.first_voice == 'true' }}
        run: |
          if [ "$HAVE_OPENAI" != "true" ] || [ "$HAVE_STORAGE" != "true" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            {
              echo '### No audio synthesised'
              echo
              echo "Giving the bank a voice needs \`OPENAI_API_KEY\` (present: $HAVE_OPENAI)"
              echo "and the R2 pair \`R2_ACCESS_KEY_ID\` + \`R2_SECRET_ACCESS_KEY\` (present: $HAVE_STORAGE)."
              echo 'Until then listening items show their text. See blockers.md.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          $WRANGLER d1 execute "$DB" --remote --json \
            --command "select id from audio_clips where audio_path is not null" \
            | jq -r '.[0].results[].id' > "$RUNNER_TEMP/have.txt"
          live=$(wc -l < "$RUNNER_TEMP/have.txt")
          echo "$live clip(s) already live"
          if [ "$live" -eq 0 ] && [ "$FIRST_VOICE" != "true" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            {
              echo '### No audio synthesised'
              echo
              echo 'No clip is live in the database. Recording now would replace every voice'
              echo 'a learner has heard; find out why the database has no clip first. A library'
              echo 'started from nothing is the run form'"'"'s `first_voice`.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: give the bank its voice
        if: steps.tts.outputs.go == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REMAKE_LIST: ${{ github.event.inputs.remake_list }}
        working-directory: .
        run: |
          shopt -s nullglob
          failed=0
          # Blank on every automatic run: only the run form can set it, so a
          # merge can extend the library but never re-record part of it.
          remake=()
          if [ -n "$REMAKE_LIST" ]; then
            if [ ! -f "$REMAKE_LIST" ]; then
              echo "::error::remake_list: no such file in this checkout: $REMAKE_LIST"
              exit 1
            fi
            remake=(--remake "$REMAKE_LIST")
            echo "::notice::re-recording the clips named in $REMAKE_LIST"
          fi
          for f in batches/*.json; do
            case "$f" in *.source.json) continue ;; esac
            out="${f%.json}.audio.sql"
            rm -f "$out"
            echo "::group::$f"
            # One bundle failing must not stop the rest: its clips are made on
            # the next run, and everything that did reach the bucket is pointed
            # at now.
            node bjt/main.ts synth "$f" --provider openai --have "$RUNNER_TEMP/have.txt" \
              "${remake[@]}" --upload --out "$out" || failed=1
            if [ -f "$out" ]; then
              (cd client && $WRANGLER d1 execute "$DB" --remote --yes --file "../$out")
            fi
            echo "::endgroup::"
          done
          {
            echo '### Audio'
            echo
            echo '```'
            (cd client && $WRANGLER d1 execute "$DB" --remote --json --command "
              select sum(audio_path is not null)          as clips_live,
                     sum(audio_path is null)              as clips_silent,
                     coalesce(sum(duration_ms) / 60000, 0) as minutes
                from audio_clips;" | jq -c '.[0].results[0]')
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $failed

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.tts.outputs.go == 'true' && always()
        with:
          name: audio
          path: |
            media/audio
            media/reports
          if-no-files-found: ignore

      - name: what the database holds now
        if: always() && steps.db.outputs.go == 'true'
        run: |
          {
            echo '## The database after this run'
            echo
            echo '```'
            $WRANGLER d1 execute "$DB" --remote --json --command "
              select (select count(*) from d1_migrations)                              as migrations,
                     (select count(*) from items where is_published = 1)              as published_items,
                     (select count(*) from scenes where image_path is not null)       as scenes_with_art,
                     (select count(*) from audio_clips where audio_path is not null)  as clips_with_audio,
                     (select count(*) from testers)                                   as testers;" \
              | jq -c '.[0].results[0]'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
