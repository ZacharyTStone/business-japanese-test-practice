plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.businessjapanesedrill.googlesignin'
version = '0.1.0'

android {
  namespace "app.businessjapanesedrill.googlesignin"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // Credential Manager, and Google's provider for it (Play services), as
  // Google's "Sign in with Google" guide lists them.
  implementation "androidx.credentials:credentials:1.5.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
