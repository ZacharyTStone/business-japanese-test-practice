[project]
name = "bjt-practice"
version = "0.1.0"
description = "Personal study tool generating BJT-format practice items (phase 1: 語彙・文法 and 表現読解)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",   # only needed for live generation; offline commands run without it
]

[project.scripts]
bjt = "bjt.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bjt*"]
