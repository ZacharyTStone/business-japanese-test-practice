[project]
name = "bjt-practice"
version = "0.1.0"
description = "Personal study tool generating BJT-format practice items (phase 1: 語彙・文法 and 表現読解)"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40",     # only needed for live generation; offline commands run without it
    "python-dotenv>=1.0",  # optional .env auto-loading
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only the Google Cloud adapter needs a package; gemini and openai speak plain
# HTTPS from the standard library, so a key is all they need.
tts-google = ["google-cloud-texttospeech>=2.16"]

[project.scripts]
bjt = "bjt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bjt*"]
